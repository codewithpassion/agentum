# Publishes the computer images people pull onto their own hardware. The plain image is the
# headless daemon; the desktop image adds Xvfb, openbox and Chromium. Both are tagged `latest`
# plus the commit, so a host can be pinned to a known build.
#
# Dom is on the free GitHub plan, so this runs only when started by hand (docs/workflow.md,
# "GitHub"). Do not add push or pull_request triggers until Dom says so.
name: computer images

on:
  workflow_dispatch:

concurrency:
  group: computer-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io names must be lowercase and the owner login may not be.
      - name: Image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/computer
          file: apps/computer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agentum-computer:latest
            ghcr.io/${{ env.OWNER }}/agentum-computer:${{ github.sha }}
          cache-from: type=gha,scope=computer
          cache-to: type=gha,mode=max,scope=computer

      - uses: docker/build-push-action@v6
        with:
          context: apps/computer
          file: apps/computer/Dockerfile.desktop
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agentum-computer-desktop:latest
            ghcr.io/${{ env.OWNER }}/agentum-computer-desktop:${{ github.sha }}
          cache-from: type=gha,scope=computer-desktop
          cache-to: type=gha,mode=max,scope=computer-desktop

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static Rust binaries
        run: |
          pip install ziglang==0.14.1
          echo "$(python -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent)')" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked
          export PATH="$(python -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent)'):$PATH"
          bash apps/agentum/scripts/build-all.sh

      - uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agentum/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agentum:latest
            ghcr.io/${{ env.OWNER }}/agentum:${{ github.sha }}
          cache-from: type=gha,scope=agentum
          cache-to: type=gha,mode=max,scope=agentum

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agentum/Dockerfile.desktop
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agentum:desktop
            ghcr.io/${{ env.OWNER }}/agentum:desktop-${{ github.sha }}
          cache-from: type=gha,scope=agentum-desktop
          cache-to: type=gha,mode=max,scope=agentum-desktop
