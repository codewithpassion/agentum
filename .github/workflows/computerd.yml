# Publishes the computerd image users pull onto their own hardware, and that
# Agentum names when it creates a Fly Machine. Tagged `latest` plus the commit,
# so a host can be pinned to a known build.
name: computerd image

on:
  push:
    branches: [main]
    paths:
      - "apps/computerd/**"
      - ".github/workflows/computerd.yml"

concurrency:
  group: computerd-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/computerd
          push: true
          tags: |
            ghcr.io/codewithpassion/agentum-computerd:latest
            ghcr.io/codewithpassion/agentum-computerd:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
