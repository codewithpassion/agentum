name: Worker Preview

# Every pull request gets a preview of the staging Worker with its own D1
# database, deleted when the PR closes. Setup: the setup-previews skill
# (.claude/skills/setup-previews). Until the CLOUDFLARE_API_TOKEN secret exists
# both jobs skip.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview
    # Fork PRs never see secrets, so they get no preview.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, skipping the preview. Run the setup-previews skill to enable it."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok

      - name: Install dependencies
        if: steps.creds.outputs.ok
        run: bun install --frozen-lockfile

      - name: Build (staging)
        if: steps.creds.outputs.ok
        run: bun run --cwd apps/web staging:build

      - name: Deploy preview
        id: preview
        if: steps.creds.outputs.ok
        env:
          # Through env, never interpolated into the script, so a crafted PR
          # title cannot inject shell commands.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          export PREVIEW_MESSAGE="PR #$PR_NUMBER: $PR_TITLE"
          bun apps/web/scripts/preview.ts deploy --name "$PREVIEW_NAME"

      - name: Comment preview URL on the PR
        if: steps.creds.outputs.ok
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --edit-last --create-if-none \
            --body "Preview for \`$HEAD_SHA\`: $URL"

  cleanup:
    name: Delete preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok

      - name: Install dependencies
        if: steps.creds.outputs.ok
        run: bun install --frozen-lockfile

      # No build here, so wrangler reads wrangler.jsonc directly; the script
      # passes --env staging so it targets the staging Worker, not production.
      - name: Delete preview and its database
        if: steps.creds.outputs.ok
        run: bun apps/web/scripts/preview.ts delete --name "$PREVIEW_NAME"
