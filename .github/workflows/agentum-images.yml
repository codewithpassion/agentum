# Publishes the Agentum client images people pull onto their own hardware. The plain image is
# headless; the desktop image adds Xvfb, openbox and Chromium. Both carry the commit in a tag,
# so a host can be pinned to a known build.
#
# The binaries are built once into apps/agentum/dist/. The run uploads those same bytes to the
# staging and, when chosen, production R2 buckets under releases/agentum-rs/<version>/, so a
# machine on an image has a known version. It never writes latest.json, so no image build is
# offered as an update. latest.json moves only through the manual publish-releases.ts run. A
# version already in a bucket is skipped, never overwritten. Without the CLOUDFLARE_API_TOKEN
# repo secret the upload is skipped with a warning and the images still build.
#
# Dom is on the free GitHub plan, so this runs only when started by hand (docs/workflow.md,
# "GitHub"). Do not add push or pull_request triggers until Dom says so.
name: agentum images

on:
  workflow_dispatch:
    inputs:
      buckets:
        description: R2 buckets that get this build's binaries
        type: choice
        default: staging and production
        options:
          - none
          - staging
          - staging and production

concurrency:
  group: agentum-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr.io names must be lowercase and the owner login may not be.
      - name: Image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static Rust binaries
        run: |
          pip install ziglang==0.14.1
          echo "$(python -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent)')" >> "$GITHUB_PATH"
          cargo install cargo-zigbuild --version 0.24.1 --locked
          export PATH="$(python -c 'import ziglang, pathlib; print(pathlib.Path(ziglang.__file__).parent)'):$PATH"
          bash apps/agentum/scripts/build-all.sh

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Publish binaries to R2
        if: inputs.buckets != 'none'
        env:
          BUCKETS: ${{ inputs.buckets }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so the binaries were not published to R2. The images still build."
            exit 0
          fi
          bun scripts/publish-releases.ts --env staging --binaries-only --prebuilt
          if [ "$BUCKETS" = "staging and production" ]; then
            bun scripts/publish-releases.ts --env production --binaries-only --prebuilt
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agentum/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agentum:latest
            ghcr.io/${{ env.OWNER }}/agentum:${{ github.sha }}
          cache-from: type=gha,scope=agentum
          cache-to: type=gha,mode=max,scope=agentum

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agentum/Dockerfile.desktop
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/agentum:desktop
            ghcr.io/${{ env.OWNER }}/agentum:desktop-${{ github.sha }}
          cache-from: type=gha,scope=agentum-desktop
          cache-to: type=gha,mode=max,scope=agentum-desktop
