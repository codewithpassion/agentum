<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Orders, live</title>
  </head>
  <body>
    <h1>Orders, live</h1>
    <p id="status">Loading</p>
    <p id="orders"></p>
    <p id="visits"></p>
    <p id="team-note"></p>
    <button id="ask" type="button">Ask the agent</button>
    <script>
    // A live dashboard: one read-only tool call, a per-viewer visit counter,
    // a shared team note, and a message to the agent.
    "use strict";
    (async () => {
      const hm = window.harbourmaster;
      const show = (id, text) => {
        document.getElementById(id).textContent = text;
      };
      if ((await hm.ready) === null) {
        show("status", "Not connected");
        return;
      }
      try {
        const orders = await hm.tools.call("shop/list_orders", { days: 7 });
        show("orders", `${orders.structuredContent.orders.length} orders`);
        const seen = (await hm.storage.get("visits")) ?? 0;
        await hm.storage.set("visits", seen + 1);
        show("visits", `Visit ${seen + 1}`);
        const note = await hm.storage.get("note", "shared");
        show("team-note", note ?? "No note");
        show("status", "Live");
      } catch (error) {
        show("status", error.message);
      }
      document.getElementById("ask").onclick = () => {
        hm.sendMessage("Please refresh the orders").catch((error) => {
          show("status", error.message);
        });
      };
    })();
    </script>
  </body>
</html>
