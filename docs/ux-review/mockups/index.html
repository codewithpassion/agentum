<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Harbourmaster: three directions</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=Newsreader:opsz,wght@6..72,300..600&display=swap"
      rel="stylesheet"
    >
    <style>
    /* Tokens copied from apps/web/src/styles.css. Colour is out of scope for this review,
   so the three directions differ in structure and flow only. */
    :root {
      --paper: #faf9f5;
      --ink: #141413;
      --card: #fff;
      --muted: #f0eee6;
      --line: #e3e1d8;
      --soft: #6b6a63;
      --faint: #9a988f;
      --accent: #c9654a;
      --accent-ink: #fff;
      --accent-wash: #fbeee9;
      --good: #2f7d5b;
      --code: #f4f2ea;
      --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      --serif: "Newsreader", ui-serif, Georgia, serif;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      font: 15px / 1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
      background: var(--paper);
    }
    button,
    input,
    textarea,
    select {
      font: inherit;
      color: inherit;
    }
    button {
      padding: 0;
      text-align: left;
      cursor: pointer;
      background: none;
      border: 0;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    h1,
    h2,
    h3,
    p {
      margin: 0;
    }
    .btn {
      display: inline-block;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .btn:hover {
      background: var(--muted);
    }
    .btn.go {
      color: var(--accent-ink);
      background: var(--accent);
      border-color: var(--accent);
    }
    .btn.go:hover {
      filter: brightness(0.94);
    }
    .btn.quiet {
      color: var(--soft);
      background: none;
      border-color: transparent;
    }
    .btn.quiet:hover {
      color: var(--ink);
      background: var(--muted);
    }
    .link {
      font-size: 14px;
      color: var(--soft);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .link:hover {
      color: var(--ink);
    }
    .input,
    textarea.input {
      width: 100%;
      padding: 9px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    textarea.input {
      min-height: 88px;
      line-height: 1.5;
      resize: vertical;
    }
    .tile {
      display: grid;
      flex: none;
      place-items: center;
      width: 26px;
      height: 26px;
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: #0f8f7f;
      border-radius: 7px;
    }
    .tile.ic {
      background: #d9730d;
    }

    /* Mockup chrome, not part of any direction */
    .chrome {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 8px 14px;
      font-size: 13px;
      color: #faf9f5;
      background: var(--ink);
    }
    .chrome strong {
      margin-right: 10px;
      font-weight: 500;
    }
    .chrome .seg {
      display: inline-flex;
      padding: 2px;
      margin-right: 10px;
      background: #2a2a28;
      border-radius: 7px;
    }
    .chrome .seg button {
      padding: 4px 11px;
      color: #c9c7be;
      border-radius: 5px;
    }
    .chrome .seg button[aria-pressed="true"] {
      color: var(--ink);
      background: #faf9f5;
    }
    .chrome .right {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .chrome .right button {
      padding: 4px 11px;
      color: #e6e4dc;
      border: 1px solid #4a4a46;
      border-radius: 6px;
    }
    .chrome .right button:hover {
      background: #2a2a28;
    }
    #stage {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* A: the rail */
    .rail {
      display: flex;
      flex: none;
      flex-direction: column;
      width: 320px;
      min-height: 0;
      background: #f6f4ec;
      border-right: 1px solid var(--line);
    }
    .rail-top {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 14px 8px;
    }
    .rail-top .name {
      flex: 1;
      font: 500 18px / 1 var(--serif);
    }
    .rail-scroll {
      flex: 1;
      min-height: 0;
      padding: 4px 8px 12px;
      overflow: auto;
    }
    .rail h2 {
      display: flex;
      justify-content: space-between;
      padding: 12px 8px 6px;
      font: 500 13px / 1 var(--sans);
      color: var(--soft);
    }
    .need {
      display: block;
      width: 100%;
      padding: 10px 10px 11px;
      margin-bottom: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 9px;
    }
    .need:hover {
      border-color: #cfccc0;
      border-left-color: var(--accent);
    }
    .need[aria-current="true"] {
      background: var(--accent-wash);
      border-color: #eccabd;
      border-left-color: var(--accent);
    }
    .need b {
      display: block;
      font-weight: 500;
      line-height: 1.3;
    }
    .need span {
      display: block;
      margin-top: 2px;
      font-size: 13px;
      color: var(--soft);
    }
    .work {
      display: flex;
      gap: 9px;
      align-items: center;
      width: 100%;
      padding: 4px 8px;
      font-size: 13px;
      color: var(--faint);
      border-radius: 6px;
    }
    .work:hover {
      color: var(--soft);
      background: var(--muted);
    }
    .work[aria-current="true"] {
      color: var(--soft);
      background: var(--muted);
    }
    .work i {
      flex: none;
      width: 7px;
      height: 7px;
      background: #c4c1b5;
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }
    .work span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .doneline {
      display: block;
      width: 100%;
      padding: 8px 8px 4px;
      font-size: 13px;
      color: var(--faint);
    }
    .doneline:hover {
      color: var(--soft);
    }
    .rail-nav {
      display: grid;
      flex: none;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2px;
      padding: 8px;
      border-top: 1px solid var(--line);
    }
    .rail-nav button {
      padding: 7px 8px;
      font-size: 13px;
      color: var(--soft);
      text-align: center;
      border-radius: 6px;
    }
    .rail-nav button:hover,
    .rail-nav button[aria-current="true"] {
      color: var(--ink);
      background: var(--muted);
    }
    .pane {
      flex: 1;
      min-width: 0;
      padding: 36px 48px 60px;
      overflow: auto;
    }
    .pane-in {
      max-width: 720px;
      margin: 0 auto;
    }
    .pane h1 {
      font: 400 32px / 1.15 var(--serif);
      letter-spacing: -0.01em;
    }
    .sub {
      margin-top: 6px;
      color: var(--soft);
    }
    .quote {
      padding-left: 14px;
      margin-top: 24px;
      color: var(--soft);
      border-left: 2px solid var(--line);
    }
    .quote small {
      display: block;
      margin-bottom: 2px;
      font-size: 13px;
      color: var(--faint);
    }
    .draft {
      margin-top: 22px;
    }
    .draft label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .draft textarea {
      min-height: 150px;
    }
    .who {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 12px;
      font-size: 14px;
      color: var(--soft);
    }
    .who b {
      font-weight: 500;
      color: var(--ink);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 20px;
    }
    .expiry {
      margin-left: auto;
      font-size: 13px;
      color: var(--faint);
    }
    details.hood {
      padding-top: 12px;
      margin-top: 36px;
      border-top: 1px solid var(--line);
    }
    details.hood summary {
      font-size: 14px;
      color: var(--soft);
      cursor: pointer;
    }
    .hood ol {
      padding-left: 20px;
      margin: 12px 0 0;
      font-size: 14px;
      color: var(--soft);
    }
    .hood ol li {
      margin-bottom: 4px;
    }
    .hood code {
      padding: 1px 5px;
      font-size: 12.5px;
      background: var(--code);
      border-radius: 4px;
    }
    .steps {
      padding: 0;
      margin: 28px 0 0;
      list-style: none;
    }
    .steps li {
      padding: 16px 0;
      border-top: 1px solid var(--line);
    }
    .steps li:last-child {
      border-bottom: 1px solid var(--line);
    }
    .steps h3 {
      display: flex;
      gap: 10px;
      align-items: baseline;
      font-size: 16px;
      font-weight: 500;
    }
    .steps .num {
      font-variant-numeric: tabular-nums;
      color: var(--faint);
    }
    .steps p {
      margin: 4px 0 0 22px;
      font-size: 14px;
      color: var(--soft);
    }
    .steps .body {
      margin: 12px 0 0 22px;
    }
    .steps .ok h3 {
      color: var(--faint);
    }
    .steps .ok .num {
      color: var(--good);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      padding: 4px 11px;
      font-size: 13px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 99px;
    }
    .chip:hover {
      background: var(--muted);
    }
    .rise {
      animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes rise {
      from {
        transform: translateY(14px);
        opacity: 0;
        box-shadow: 0 0 0 3px var(--accent-wash);
      }
      to {
        transform: none;
        opacity: 1;
      }
    }
    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }

    /* Palette and overlays */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 9vh;
      background: rgba(20, 20, 19, 0.35);
    }
    .palette {
      width: min(640px, 92vw);
      max-height: 76vh;
      padding: 6px 6px 12px;
      overflow: auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 18px 60px rgba(20, 20, 19, 0.25);
    }
    .palette input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
    }
    .palette h3 {
      padding: 12px 14px 2px;
      font-size: 13px;
      font-weight: 500;
      color: var(--soft);
    }
    .palette button {
      display: flex;
      gap: 20px;
      justify-content: space-between;
      width: 100%;
      padding: 6px 14px;
      border-radius: 6px;
    }
    .palette button:hover {
      background: var(--muted);
    }
    .palette button span {
      font-size: 13px;
      color: var(--faint);
    }
    .mapdlg {
      width: min(980px, 94vw);
      max-height: 84vh;
      padding: 22px 24px;
      overflow: auto;
      background: var(--card);
      border-radius: 12px;
    }
    .mapdlg h2 {
      margin-bottom: 4px;
      font: 400 24px / 1.2 var(--serif);
    }
    .mapdlg p {
      margin-bottom: 14px;
      color: var(--soft);
    }
    table {
      width: 100%;
      font-size: 14px;
      border-collapse: collapse;
    }
    th {
      padding: 6px 10px;
      font-weight: 500;
      color: var(--soft);
      text-align: left;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 7px 10px;
      vertical-align: top;
      border-bottom: 1px solid var(--muted);
    }
    td:first-child {
      font-weight: 500;
      white-space: nowrap;
    }

    /* B: the note */
    .bwrap {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .btop {
      display: flex;
      flex: none;
      gap: 22px;
      align-items: center;
      padding: 14px 28px;
    }
    .btop .name {
      margin-right: 6px;
      font: 500 18px / 1 var(--serif);
    }
    .btop button {
      padding: 2px 0;
      font-size: 14px;
      color: var(--soft);
    }
    .btop button:hover {
      color: var(--ink);
    }
    .btop button[aria-current="true"] {
      color: var(--ink);
      border-bottom: 2px solid var(--ink);
    }
    .bscroll {
      flex: 1;
      min-height: 0;
      padding: 30px 28px 130px;
      overflow: auto;
    }
    .note {
      max-width: 660px;
      margin: 0 auto;
    }
    .note .date {
      font-size: 14px;
      color: var(--faint);
    }
    .note h1 {
      margin: 6px 0 30px;
      font: 400 44px / 1.08 var(--serif);
      letter-spacing: -0.015em;
    }
    .dec {
      padding: 0 0 26px;
      margin-bottom: 26px;
      border-bottom: 1px solid var(--line);
    }
    .dec p.say {
      font: 400 21px / 1.4 var(--serif);
    }
    .dec p.say em {
      font-style: normal;
      color: var(--soft);
    }
    .dec details {
      margin-top: 10px;
    }
    .dec summary {
      font-size: 14px;
      color: var(--soft);
      cursor: pointer;
    }
    .dec .ta {
      margin-top: 10px;
    }
    .dec .actions {
      margin-top: 12px;
    }
    .dec.gone {
      padding-bottom: 14px;
      margin-bottom: 14px;
      opacity: 0.45;
    }
    .dec.gone p.say {
      font-family: var(--sans);
      font-size: 16px;
    }
    .note h2 {
      margin: 34px 0 6px;
      font: 400 22px / 1.2 var(--serif);
    }
    .prose {
      font: 400 18px / 1.55 var(--serif);
      color: #3a3935;
    }
    .ask {
      position: fixed;
      bottom: 22px;
      left: 50%;
      display: flex;
      gap: 6px;
      width: min(660px, 92vw);
      padding: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(20, 20, 19, 0.1);
      transform: translateX(-50%);
    }
    .ask input {
      flex: 1;
      min-width: 0;
      padding: 6px 10px;
      outline: none;
      background: none;
      border: 0;
    }
    .more-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px 40px;
      margin-top: 10px;
    }
    .more-grid h3 {
      margin-bottom: 4px;
      font-weight: 500;
    }
    .more-grid button {
      display: block;
      padding: 2px 0;
      color: var(--soft);
    }
    .more-grid button:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    /* C: jobs */
    .cnav {
      display: flex;
      flex: none;
      flex-direction: column;
      gap: 2px;
      width: 190px;
      padding: 14px 10px;
      border-right: 1px solid var(--line);
    }
    .cnav .name {
      padding: 2px 8px 14px;
      font: 500 18px / 1 var(--serif);
    }
    .cnav button {
      display: flex;
      justify-content: space-between;
      padding: 7px 10px;
      border-radius: 7px;
    }
    .cnav button:hover {
      background: var(--muted);
    }
    .cnav button[aria-current="true"] {
      font-weight: 500;
      background: var(--muted);
    }
    .cnav .count {
      font-weight: 600;
      color: var(--accent);
    }
    .cnav .foot {
      margin-top: auto;
    }
    .cmain {
      flex: 1;
      min-width: 0;
      padding: 32px 44px 60px;
      overflow: auto;
    }
    .chead {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
    }
    .chead h1 {
      flex: 1;
      min-width: 200px;
      font: 400 32px / 1.15 var(--serif);
    }
    .job {
      max-width: 860px;
      padding: 22px 0;
      border-top: 1px solid var(--line);
    }
    .sentence {
      font: 400 23px / 1.65 var(--serif);
    }
    .pill {
      display: inline;
      padding: 2px 9px 3px;
      border-radius: 7px;
      background: var(--muted);
      box-decoration-break: clone;
      white-space: nowrap;
      -webkit-box-decoration-break: clone;
    }
    button.pill {
      font: inherit;
      cursor: pointer;
    }
    button.pill:hover {
      background: #e8e5d9;
    }
    button.pill[aria-expanded="true"] {
      background: var(--accent-wash);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .pill.ppl {
      background: #e7efe9;
    }
    .pill.empty {
      color: var(--soft);
      background: none;
      border: 1px dashed var(--faint);
      box-shadow: inset 0 0 0 1px dashed;
    }
    .jobmeta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-top: 8px;
      font-size: 14px;
      color: var(--soft);
    }
    .jobmeta .wait {
      font-weight: 500;
      color: var(--accent);
    }
    .builder {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
      gap: 40px;
      align-items: start;
      margin-top: 22px;
    }
    .opts {
      padding: 14px;
      margin-top: 14px;
      background: #f6f4ec;
      border-radius: 10px;
    }
    .opts p {
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--soft);
    }
    .tryit {
      padding-left: 28px;
      border-left: 1px solid var(--line);
    }
    .tryit h2 {
      margin-bottom: 8px;
      font: 400 20px / 1.2 var(--serif);
    }
    .result {
      margin-top: 12px;
      font-size: 14px;
    }
    .result b {
      font-weight: 500;
    }
    details.adv {
      padding-top: 12px;
      margin-top: 26px;
      border-top: 1px solid var(--line);
    }
    details.adv summary {
      font-size: 14px;
      color: var(--soft);
      cursor: pointer;
    }
    .advrow {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--muted);
    }
    .advrow span:first-child {
      color: var(--soft);
    }
    .fit {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px 34px;
      max-width: 860px;
      margin-top: 22px;
    }
    .fit h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--soft);
    }
    .fit div {
      position: relative;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 9px;
    }
    .fit div.arrow::after {
      position: absolute;
      top: 50%;
      right: -34px;
      width: 34px;
      content: "";
      border-top: 1px solid var(--faint);
    }

    @media (max-width: 820px) {
      .pill {
        white-space: normal;
      }
      #stage {
        flex-direction: column;
        overflow: auto;
      }
      .rail,
      .cnav {
        width: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .rail-scroll {
        max-height: 44vh;
      }
      .pane,
      .cmain {
        padding: 22px 18px 60px;
        overflow: visible;
      }
      .builder,
      .fit {
        grid-template-columns: 1fr;
      }
      .tryit {
        padding-left: 0;
        border-left: 0;
      }
      .note h1 {
        font-size: 34px;
      }
      .more-grid {
        grid-template-columns: 1fr;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
    </style>
  </head>
  <body>
    <nav aria-label="Mockup controls" class="chrome">
      <strong>Harbourmaster mock-ups</strong>
      <span class="seg" id="dirs"></span>
      <span class="seg" id="days"></span>
      <span class="right"
        ><button id="reset">Start again</button
        ><button id="mapbtn">Where did everything go?</button></span
      >
    </nav>
    <main id="stage"></main>
    <div id="overlay"></div>
    <script>
    "use strict";
    const seed = () => [
      {
        action: "Send reply",
        agent: "Chief of Staff",

        main = `<div class="chead"><h1>How it fits</h1><button class="btn" data-c="list">Back to list</button></div>
    <p class="sub">The same three jobs, as a picture. Today's Map, in the words Priya uses.</p>
    <div class="fit"><h3>What starts it</h3><h3>Who does it</h3><h3>Where it ends up</h3>
    <div class="arrow">An email arrives</div><div class="arrow">Chief of Staff</div><div>Replies, after Priya says yes</div>
    <div class="arrow">8am on weekdays</div><div class="arrow">Chief of Staff</div><div>The morning briefing</div>
    <div class="arrow">Chief of Staff finds an overdue invoice</div><div class="arrow">Invoice Chaser</div><div>Reminders, after Dan says yes</div></div>`;
      } else {
        main = `<div class="chead"><h1>Jobs</h1><button class="btn" data-c="fit">How it fits</button><button class="btn go" data-c="new">New job</button></div>
    <div class="job" style="border-top:0"><p class="sentence">When ${pill("an email arrives at office@")}, ${pill("Chief of Staff")} sorts it and writes replies, then ${pill("asks Priya", "ppl")} before anything leaves.</p>
      <p class="jobmeta"><span class="wait">${needs().filter((i) => i.tile === "CS").length} waiting on you</span><span>Ran 31 times this week</span><span>About $0.40 this week</span><button class="link">Pause</button><button class="link">Edit</button></p></div>
    <div class="job"><p class="sentence">Every ${pill("weekday at 8am Sydney")}, ${pill("Chief of Staff")} writes the briefing, then ${pill("posts it on Today", "ppl")}.</p>
      <p class="jobmeta"><span>Ran 5 times this week</span><span>Next on Monday</span><button class="link">Pause</button><button class="link">Edit</button></p></div>
    <div class="job"><p class="sentence">When ${pill("Chief of Staff finds an overdue invoice")}, ${pill("Invoice Chaser")} writes a reminder, then ${pill("asks Dan", "ppl")}.</p>
      <p class="jobmeta"><span class="wait">${needs().filter((i) => i.tile === "IC").length} waiting on Dan</span><span>Ran twice this week</span><button class="link">Pause</button><button class="link">Edit</button></p></div>`;
      }
      return `${nav}<section class="cmain">${main}</section>`;
    }

    /* ---------- Overlays ---------- */
    const DIRECTORY = [
      [
        "Past work",
        [
          ["Every task", "Sessions and task pages"],
          ["Full log", "Log"],
          ["Questions", "Q&A and Inbox"],
        ],
      ],
      [
        "How things start",
        [
          ["Map", "Map"],
          ["Schedules", "Routines"],
          ["Web triggers", "Triggers"],
        ],
      ],
      [
        "What agents can use",
        [
          ["Apps", "Connectors and Slack"],
          ["Know-how", "Skills"],
          ["Files and wiki", "Library"],
          ["Things agents made", "Artifacts"],
        ],
      ],
      [
        "Admin",
        [
          ["AI account", "Model providers"],
          ["Passwords and keys", "Secrets"],
          ["Computers", "Machines"],
          ["Developer access", "API keys and Connected apps"],
          ["Sharing rules", "Settings, Artifacts"],
        ],
      ],
    ];
    const MAP = [
      [
        "Desk",
        "Left rail plus the pane it opens",
        "Today, the note",
        "Today, grouped by job",
      ],
      [
        "Agents, profile",
        "Agents at the foot of the rail",
        "Agents tab",
        "Inside a job, under More options",
      ],
      [
        "Map",
        "Agents, How they fit together",
        "More, Map",
        "Jobs, How it fits",
      ],
      [
        "Q&A, Inbox",
        "Questions rise in the rail. Archive under Everything",
        "Questions join the note. Archive under More",
        "Questions join Today. Archive in Settings",
      ],
      [
        "Sessions, Log, Task page",
        "How it got here on each item. Full views under Everything",
        "Under each decision. Full views under More",
        "Under each job. Full views in Settings",
      ],
      [
        "Routines, Triggers",
        "Agent page, plus Everything",
        "More",
        "The When part of each job",
      ],
      [
        "Library, wiki, Artifacts",
        "Files, with Things agents made as a filter",
        "Files tab",
        "Files",
      ],
      [
        "Skills",
        "Everything, Know-how",
        "More, Know-how",
        "Settings, Know-how",
      ],
      [
        "Connectors, Slack",
        "Apps, starting from a list with one-click sign-in",
        "Same, offered inside setup steps",
        "Same, offered inside the sentence",
      ],
      [
        "Secrets",
        "Admin, also linked from any app that needs one",
        "More, Admin",
        "Settings, Admin",
      ],
      [
        "Model providers",
        "First-run credit, then Admin, AI account",
        "More, Admin",
        "Settings, Admin",
      ],
      [
        "Machines, computers",
        "Admin, Computers. Offered when an agent needs one",
        "More, Admin",
        "More options on a job, Settings",
      ],
      [
        "API keys, Connected apps",
        "Admin, Developer access",
        "More, Admin",
        "Settings, Developer access",
      ],
    ];
    function overlay() {
      if (S.overlay === "palette") {
        return `<div class="scrim" data-close><div class="palette" role="dialog" aria-label="Find anything"><input aria-label="Find anything" placeholder="Find anything: a task, an agent, a setting">
    ${DIRECTORY.map(([h, l]) => `<h3>${h}</h3>${l.map(([a, b]) => `<button><b style="font-weight:400">${a}</b><span>${b}</span></button>`).join("")}`).join("")}</div></div>`;
      }
      if (S.overlay === "map") {
        return `<div class="scrim" data-close><div class="mapdlg" role="dialog" aria-label="Where everything went"><h2>Where did everything go?</h2><p>Nothing is removed. Every page in today's app has a home in each direction, one or two clicks from where people work.</p>
    <table><thead><tr><th>Today</th><th>A, the rail</th><th>B, the morning note</th><th>C, jobs</th></tr></thead><tbody>${MAP.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
      }
      return "";
    }

    /* ---------- Shell ---------- */
    function render() {
      document.getElementById("dirs").innerHTML = [
        ["a", "A: The rail"],
        ["b", "B: The morning note"],
        ["c", "C: Jobs"],
      ]
        .map(
          ([k, l]) =>
            `<button aria-pressed="${S.dir === k}" data-dir="${k}">${l}</button>`
        )
        .join("");
      document.getElementById("days").innerHTML = [
        ["1", "First day"],
        ["30", "A normal day"],
      ]
        .map(
          ([k, l]) =>
            `<button aria-pressed="${S.day === k}" data-day="${k}">${l}</button>`
        )
        .join("");
      const stage = document.getElementById("stage");
      stage.innerHTML =
        S.dir === "a" ? renderA() : S.dir === "b" ? renderB() : renderC();
      document.getElementById("overlay").innerHTML = overlay();
    }
    document.addEventListener("click", (e) => {
      const t = e.target.closest("button,[data-close]");
      if (!t) {
        return;
      }
      const d = t.dataset;
      if (d.dir) {
        S.dir = d.dir;
        S.view = "home";
      } else if (d.day) {
        S.day = d.day;
        S.view = "home";
        S.c.view = d.day === "1" ? "new" : "list";
      } else if (d.sel) {
        S.sel = d.sel;
        S.view = "home";
      } else if (d.view) {
        S.view = d.view;
      } else if (d.act) {
        act(d.act);
        return;
      } else if ("newmail" in d) {
        newMail();
        return;
      } else if ("aStep" in d) {
        S.steps += 1;
      } else if ("bStep" in d) {
        S.b.steps += 1;
      } else if (d.overlay) {
        S.overlay = d.overlay;
      } else if (d.c) {
        S.c.view = d.c;
      } else if (d.cOpen) {
        S.c.open = S.c.open === d.cOpen ? null : d.cOpen;
      } else if (d.cT) {
        S.c.trigger = d.cT;
        S.c.open = null;
      } else if (d.cA) {
        S.c.approver = d.cA;
        S.c.open = null;
      } else if ("cMail" in d) {
        S.c.mail = true;
      } else if ("cTry" in d) {
        S.c.tried = true;
      } else if ("cStart" in d) {
        S.day = "30";
        S.c.view = "list";
      } else if ("close" in d) {
        if (e.target === t) {
          S.overlay = null;
        } else {
          return;
        }
      } else {
        return;
      }
      render();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && S.overlay) {
        S.overlay = null;
        render();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        S.overlay = "palette";
        render();
      }
    });
    document.getElementById("mapbtn").onclick = () => {
      S.overlay = "map";
      render();
    };
    document.getElementById("reset").onclick = () => {
      Object.assign(S, {
        b: { steps: 0 },
        c: {
          approver: null,
          open: null,
          tried: false,
          trigger: null,
          view: S.day === "1" ? "new" : "list",
        },
        done: 14,
        items: seed(),
        sel: "tom",
        steps: 0,
        view: "home",
      });
      render();
    };
    const params = new URLSearchParams(location.search);
    if (params.get("dir")) {
      S.dir = params.get("dir");
    }
    if (params.get("day")) {
      S.day = params.get("day");
      if (S.day === "1") {
        S.c.view = "new";
      }
    }
    render();
    </script>
  </body>
</html>
