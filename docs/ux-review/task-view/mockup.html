<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task view mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a1a; --fg: #fff; --card: #212121; --muted: #a5a5a5; --idle: #c4c4c4; --border: #3a3a3a;
  --sidebar: #141414; --primary: #ff7733; --red: #ff3859; --cyan: #00d4ff; --gray: #2a2a2a; --green: #2fbf71; --amber: #f5b83d;
  --accent: color-mix(in srgb, #00d4ff 14%, #2a2a2a);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 Roboto, sans-serif; overflow: hidden; }
svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
code, pre, .mono { font-family: "Roboto Mono", monospace; }
kbd { font: 11px Roboto, sans-serif; color: var(--muted); border: 1px solid var(--border); padding: 0 4px; }

.shell { display: flex; flex-direction: column; height: 100vh; }
.top { height: 60px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--border); }
.brand { font: 20px Audiowide, sans-serif; display: flex; align-items: center; gap: 10px; }
.brand:before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.acts { display: flex; gap: 8px; align-items: center; }
.tbtn { border: 1px solid var(--border); height: 32px; padding: 0 10px; display: flex; gap: 6px; align-items: center; }
.tbtn.new { background: var(--primary); color: #1a1a1a; border-color: var(--primary); font-weight: 500; }
.av { width: 28px; height: 28px; border-radius: 50%; background: #7c5cff; }
.frame { flex: 1; min-height: 0; display: flex; }
.rail { width: 320px; flex: none; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.ws { padding: 18px 16px 8px; font: 20px Audiowide, sans-serif; }
.sec { display: flex; justify-content: space-between; padding: 6px 16px; color: var(--muted); font-size: 13px; font-weight: 500; }
.ritems { flex: 1; padding: 0 8px; }
.ritem { background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--red); padding: 8px 12px; margin-bottom: 6px; }
.ritem.open { outline: 1px solid var(--cyan); }
.ritem b { display: block; font-weight: 500; }
.ritem i { font-style: normal; color: var(--muted); font-size: 12px; }
.rfoot { border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4,1fr); }
.rfoot span { text-align: center; padding: 14px 0; color: var(--idle); font-size: 13px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }

/* shared task header */
.thead { flex: none; padding: 14px 24px 12px; border-bottom: 1px solid var(--border); }
.crumb { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
.trow { display: flex; align-items: flex-start; gap: 12px; }
.trow h1 { flex: 1; min-width: 0; margin: 0; font: 22px/1.3 Audiowide, sans-serif; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 10px; border: 1px solid; margin-top: 3px; }
.pill.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 50%, transparent); background: color-mix(in srgb, var(--green) 12%, transparent); }
.pill.running { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 50%, transparent); background: color-mix(in srgb, var(--cyan) 10%, transparent); }
.pill.failed { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 12%, transparent); }
.pill.paused { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, transparent); background: color-mix(in srgb, var(--amber) 12%, transparent); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); font-weight: 500; font-size: 13px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #1a1a1a; }
.btn.danger { border-color: color-mix(in srgb, var(--red) 60%, transparent); color: var(--red); }
.meta { margin-top: 6px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 0; }
.meta > span:not(:last-child):after { content: "·"; padding: 0 8px; color: #666; }
.meta a { color: var(--fg); text-decoration: none; }

/* conversation */
.convo { display: flex; flex-direction: column; gap: 18px; padding: 20px 0 24px; }
.msg-user { align-self: flex-end; max-width: 80%; }
.msg-user .who { text-align: right; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.bubble { background: color-mix(in srgb, var(--primary) 85%, #000); color: #fff; padding: 10px 14px; }
.edit { text-align: right; color: var(--muted); font-size: 12px; margin-top: 4px; }
.asst { display: flex; gap: 12px; }
.tile { width: 28px; height: 28px; flex: none; display: grid; place-items: center; background: #2f8f7f; font-size: 11px; font-weight: 700; }
.asst .body { flex: 1; min-width: 0; }
.asst .who { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin-bottom: 4px; }
.md h3 { font-size: 15px; margin: 14px 0 6px; }
.md code { background: var(--gray); padding: 1px 5px; font-size: 12.5px; }
.md pre { background: #111; border: 1px solid var(--border); padding: 10px 12px; overflow-x: auto; font-size: 12.5px; margin: 0 0 10px; }
.tool { border: 1px solid var(--border); background: var(--card); font-size: 13px; }
.tool .h { display: flex; align-items: center; gap: 8px; padding: 6px 10px; min-height: 34px; }
.tool .h .n { font-weight: 500; }
.tool .h .d { color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool .h .t { color: var(--muted); font-size: 12px; }
.tool pre { margin: 0; border-top: 1px solid var(--border); padding: 8px 10px; font-size: 12px; color: var(--idle); white-space: pre-wrap; max-height: 140px; overflow: hidden; }
.tool .lbl { font-size: 11px; color: var(--muted); padding: 6px 10px 0; border-top: 1px solid var(--border); text-transform: uppercase; letter-spacing: .04em; }
.tool .lbl + pre { border-top: 0; }
.tools { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.spin { width: 12px; height: 12px; border: 2px solid var(--cyan); border-right-color: transparent; border-radius: 50%; }
.ok { color: var(--green); } .bad { color: var(--red); }
.reason { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.errcard { border: 1px solid color-mix(in srgb, var(--red) 55%, transparent); background: color-mix(in srgb, var(--red) 9%, var(--bg)); padding: 12px 14px; }
.errcard b { color: var(--red); display: block; margin-bottom: 4px; }
.errcard .acts2 { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.ask { border: 1px solid color-mix(in srgb, var(--amber) 60%, transparent); background: color-mix(in srgb, var(--amber) 8%, var(--bg)); padding: 12px 14px; }
.ask .k { color: var(--amber); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.ask pre { background: #111; border: 1px solid var(--border); padding: 8px 10px; font-size: 12.5px; margin: 8px 0; white-space: pre-wrap; }
.ask .acts2 { display: flex; gap: 8px; flex-wrap: wrap; }
.working { color: var(--cyan); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.rundiv { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.rundiv:before, .rundiv:after { content: ""; flex: 1; height: 1px; background: var(--border); }
.rundiv a { color: var(--idle); }
.rundiv .bad { font-weight: 500; }
.collapsed-runs { border: 1px dashed var(--border); color: var(--muted); font-size: 13px; padding: 8px 12px; display: flex; justify-content: space-between; }

/* composer */
.composer { flex: none; border-top: 1px solid var(--border); background: var(--bg); padding: 12px 0 14px; }
.composer .box { border: 1px solid var(--border); background: var(--card); }
.composer textarea { width: 100%; border: 0; background: none; color: var(--fg); font: inherit; padding: 10px 12px; resize: none; height: 44px; outline: none; }
.composer .bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; }
.composer .bar .sp { flex: 1; }
.composer .note { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
.composer.off .box { opacity: .5; }
.ibtn { height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--idle); padding: 0 8px; font-size: 13px; }
.send { background: var(--primary); color: #1a1a1a; height: 30px; padding: 0 14px; font-weight: 500; }
.off .send { background: #5a3a2a; color: #999; }

/* panels */
.panel h2 { font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 8px; display: flex; justify-content: space-between; }
.panel h2 a { text-transform: none; letter-spacing: 0; color: var(--idle); }
.psec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.facts { display: grid; grid-template-columns: 88px 1fr; gap: 4px 8px; font-size: 13px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-top: 1px solid var(--border); }
.file:first-of-type { border-top: 0; }
.file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .sz { color: var(--muted); font-size: 12px; }
.tag { font: 11px "Roboto Mono", monospace; padding: 0 5px; }
.tag.new { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.tag.edit { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.empty { color: var(--muted); font-size: 13px; }
.link { color: var(--idle); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px; min-height: 30px; }
.steps li .i { width: 18px; height: 18px; display: grid; place-items: center; font-size: 10px; border: 1px solid var(--border); color: var(--muted); flex: none; }
.steps li.ok .i { border-color: var(--green); color: var(--green); }
.steps li.bad .i { border-color: var(--red); color: var(--red); }
.steps li.run .i { border-color: var(--cyan); color: var(--cyan); }
.steps li.wait .i { border-color: var(--amber); color: var(--amber); }
.steps li .x { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps li .tm { color: var(--muted); font-size: 12px; }
.steps li.cur { background: var(--accent); box-shadow: inset 2px 0 var(--cyan); }
.log { font-size: 13px; }
.log .row { display: grid; grid-template-columns: 52px 74px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); }
.log .row:first-child { border-top: 0; }
.log .tm { color: var(--muted); font-size: 12px; }
.ltag { font: 11px "Roboto Mono", monospace; padding: 0 5px; align-self: start; justify-self: start; background: var(--gray); color: var(--idle); }
.ltag.error { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
.ltag.tool { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.screen { aspect-ratio: 16/10; background: linear-gradient(135deg, #24324a, #1d2433); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.mailrow { display: flex; gap: 8px; font-size: 12.5px; padding: 4px 0; align-items: center; }
.mailrow .w { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font-size: 11px; padding: 1px 8px; border: 1px solid var(--border); color: var(--muted); }
.chip.on { color: var(--primary); border-color: var(--primary); }
.chip.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, transparent); }

/* Option A: conversation is the page, details column on the right */
.A-body { flex: 1; min-height: 0; display: flex; }
.A-chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.A-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px; }
.A-col { max-width: 720px; margin: 0 auto; }
.A-chat .composer { padding-left: 24px; padding-right: 24px; }
.A-chat .composer > div { max-width: 720px; margin: 0 auto; }
.A-side { width: 300px; flex: none; border-left: 1px solid var(--border); overflow-y: auto; background: #1c1c1c; }
.drawer { position: fixed; top: 60px; right: 0; bottom: 0; width: 460px; background: #1f1f1f; border-left: 1px solid var(--border); box-shadow: -12px 0 30px #0009; z-index: 10; display: flex; flex-direction: column; }
.drawer .dh { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 500; }
.drawer .db { flex: 1; overflow-y: auto; padding: 8px 16px; }

/* Option B: tabs */
.B-tabs { flex: none; display: flex; gap: 2px; padding: 0 24px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.B-tabs a { text-decoration: none; padding: 10px 14px; color: var(--idle); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 6px; align-items: center; min-height: 42px; }
.B-tabs a .c { color: var(--muted); font-weight: 400; font-size: 12px; }
.B-tabs a.on { color: var(--fg); border-bottom-color: var(--primary); }
.B-tabs a .alert { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
.B-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 24px; }
.B-col { max-width: 780px; margin: 0 auto; }
.B-main .composer { padding-left: 24px; padding-right: 24px; }
.B-main .composer > div { max-width: 780px; margin: 0 auto; }
.B-runsel { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--border); padding: 0 8px; height: 26px; font-size: 12px; color: var(--idle); }
.rstep { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--border); }
.rstep:first-child { border-top: 0; }
.rstep .n { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.rstep.ok .n { border-color: var(--green); color: var(--green); } .rstep.bad .n { border-color: var(--red); color: var(--red); }
.rstep .tt { font-weight: 500; } .rstep .sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.kv { display: inline-flex; font-size: 12px; border: 1px solid var(--border); margin: 0 4px 4px 0; }
.kv b { font: 11px "Roboto Mono", monospace; background: var(--gray); color: var(--muted); padding: 1px 6px; font-weight: 400; } .kv span { padding: 1px 6px; }
.ftable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ftable td, .ftable th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--border); }
.ftable th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }

/* Option C: outline pane + conversation pane */
.C-body { flex: 1; min-height: 0; display: flex; }
.C-out { width: 296px; flex: none; border-right: 1px solid var(--border); overflow-y: auto; background: #1c1c1c; }
.C-chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.C-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 28px; }
.C-col { max-width: 700px; margin: 0 auto; }
.C-chat .composer { padding-left: 28px; padding-right: 28px; }
.C-chat .composer > div { max-width: 700px; margin: 0 auto; }
.acc { border-bottom: 1px solid var(--border); }
.acc .ah { display: flex; align-items: center; gap: 8px; padding: 12px 16px; font-weight: 500; font-size: 13px; }
.acc .ah .c { color: var(--muted); font-weight: 400; }
.acc .ah .sp { flex: 1; }
.acc .ab { padding: 0 16px 12px; }
.anchor-hl { outline: 1px solid var(--cyan); outline-offset: 6px; }

/* phone */
.phone .top { height: 52px; padding: 0 12px; }
.phone .rail { display: none; }
.phone .thead { padding: 10px 16px 10px; }
.phone .trow h1 { font-size: 17px; }
.phone .A-side, .phone .C-out { display: none; }
.phone .A-scroll, .phone .B-scroll, .phone .C-scroll { padding: 0 16px; }
.phone .composer { padding: 8px 12px 10px !important; }
.phone .composer textarea { height: 40px; }
.phone .B-tabs { padding: 0 8px; }
.phone .msg-user { max-width: 90%; }
.phone .asst { gap: 0; } .phone .asst .tile { display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 78vh; background: #1f1f1f; border-top: 1px solid var(--border); box-shadow: 0 -12px 30px #000a; z-index: 10; overflow-y: auto; }
.scrim { position: fixed; inset: 0; background: #0009; z-index: 9; }
.grab { width: 40px; height: 4px; background: #555; margin: 8px auto; }
.phonebar { display: none; }
.phone .phonebar { display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; }
.pchip { flex: none; border: 1px solid var(--border); height: 36px; padding: 0 12px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--idle); }
.pchip .c { color: var(--muted); }
.label { position: fixed; bottom: 6px; right: 8px; font: 11px Roboto; color: #666; z-index: 50; }

/* round 2 */
.trow h1 { font-size: 20px; }
.hbtns { display: flex; gap: 8px; flex: none; }
.btn.live .dot { background: var(--green); }
.runpick { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); height: 26px; padding: 0 8px; font-size: 12.5px; color: var(--idle); margin-left: 4px; }
.meta { align-items: center; }
.err-raw { font-size: 13.5px; color: #ffd0d8; }
.errcard .code { font: 12px "Roboto Mono", monospace; color: var(--muted); margin-top: 6px; }
.edit a { color: var(--muted); text-decoration: none; display: inline-flex; gap: 4px; align-items: center; }
.edit svg { width: 13px; height: 13px; }
.rundiv.now { color: var(--idle); }
.rundiv b { color: var(--fg); font-weight: 500; }
.earlier { border: 1px solid var(--border); background: #1e1e1e; color: var(--idle); font-size: 13px; padding: 0 12px; min-height: 40px; display: flex; align-items: center; gap: 8px; }
.earlier .sp { flex: 1; }
.earlier .st { color: var(--red); }
.oldrun { opacity: .78; display: flex; flex-direction: column; gap: 14px; }
.oldrun .rundiv a { text-decoration: underline; }
.route { flex: none; border-top: 1px solid var(--border); padding: 14px 24px; background: #1d1d1d; }
.route > div { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; color: var(--idle); font-size: 13.5px; }
.route .sp { flex: 1; }
.composer .lab { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; background: #2a2a2a; border: 1px solid var(--border); padding: 0 12px; height: 34px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; box-shadow: 0 6px 16px #0008; }
.jump.req { border-color: var(--amber); color: var(--amber); }
.relwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tool .more { border-top: 1px solid var(--border); padding: 6px 10px; font-size: 12px; color: var(--idle); }
.tool pre.full { max-height: 220px; overflow: auto; }
.qopts { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.qopt { border: 1px solid var(--border); padding: 0 12px; min-height: 40px; display: flex; align-items: center; gap: 10px; background: var(--card); }
.qopt .r { width: 14px; height: 14px; border: 1px solid var(--muted); border-radius: 50%; }
.qopt.sel { border-color: var(--amber); } .qopt.sel .r { border: 4px solid var(--amber); }
.qtext { border: 1px solid var(--border); background: var(--card); min-height: 40px; padding: 10px 12px; color: var(--muted); margin-bottom: 8px; }
.side { width: 280px; flex: none; border-left: 1px solid var(--border); overflow-y: auto; background: #1c1c1c; }
.side .psec:last-child { border-bottom: 0; }
.more-row { color: var(--muted); font-size: 12.5px; padding: 6px 0 2px; }
.sbtn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 36px; border: 1px solid var(--border); font-size: 13px; font-weight: 500; margin-top: 10px; }
.drawer.wide { width: min(780px, calc(100vw - 340px)); }
.drawer .dh .x { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--border); }
.dscrim { position: fixed; inset: 60px 0 0 0; background: #0008; z-index: 9; }
.screen.big { aspect-ratio: 16/10; font-size: 13px; }

function topbar() {
  if (phone) return `<div class="top"><div style="display:flex;gap:12px;align-items:center">${ic.menu}<span class="brand">Agentum</span></div><div class="acts"><div class="av"></div></div></div>`;
  return `<div class="top"><div class="brand">Agentum</div><div class="acts"><span class="tbtn">Board</span><span class="tbtn">Find <kbd>Ctrl K</kbd></span><span class="tbtn new">+ New</span><div class="av"></div></div></div>`;
}
document.body.className = (phone ? "phone" : "") + (KB ? " kb" : "");
document.getElementById("app").innerHTML = `<div class="shell">${topbar()}<div class="frame">${phone ? "" : rail()}<main class="main" style="position:relative">${page()}</main></div></div>${KB ? '<div class="kbd">Phone keyboard</div>' : ""}<div class="label">${W} · ${S}</div>`;
// Opening position. Done: the newest run's first message at the top. With tool calls grouped into one row, the answer starts within the first screen at 1280 and 390.
// Running: follow the newest content while the reader is at the bottom. Waiting: the request card.
const menu = document.querySelector(".menu"), pick = document.querySelector(".runpick");
if (menu && pick) {
  // Anchored under the picker, kept inside the viewport with a 16px margin.
  const r = pick.getBoundingClientRect(), mainR = document.querySelector(".main").getBoundingClientRect();
  const w = Math.min(440, innerWidth - 32);
  menu.style.width = w + "px";
  menu.style.top = (r.bottom - mainR.top + 4) + "px";
  menu.style.left = (Math.min(r.left, innerWidth - 16 - w) - mainR.left) + "px";
  menu.style.right = "auto";
}
const scr = document.getElementById("scr");
if (scr && VIEW) { scr.scrollTop = document.getElementById("viewed").offsetTop - 12; }
else if (scr) {
  const at = (el, gap) => { scr.scrollTop = Math.max(0, el.offsetTop - gap); };
  const ans = document.getElementById("answer"), req = document.getElementById("req");
  if (SCROLLUP) scr.scrollTop = 0;
  else if (S === "running") scr.scrollTop = scr.scrollHeight;
  else if (waiting && req && KB) scr.scrollTop = req.offsetTop + req.offsetHeight - scr.clientHeight + 12;
  else if (waiting && req) at(req, 160);
  else if (ans && document.querySelector(".rundiv.now")) at(document.querySelector(".rundiv.now"), 8);
  else if (ans) at(document.querySelectorAll('.msg-user')[document.querySelectorAll('.msg-user').length-1], 16);
  else scr.scrollTop = scr.scrollHeight;
  if (Q.get("scroll")) scr.scrollTop = +Q.get("scroll");
}
</script>
</body>
</html>
